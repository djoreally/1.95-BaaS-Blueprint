# SDK CI. One job per language toolchain. JS also runs the live conformance suite
# against a real PocketBase 0.36.5 seeded in-job (scripts/sdk-conformance/seed-pocketbase.py).
#
# Not covered yet: PHP (no PHP SDK exists). Python, Go, and .NET SDKs are not started.
# All third-party actions are pinned to commit SHAs. Refresh them deliberately.
name: sdk-ci

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PB_VERSION: "0.36.5"

jobs:
  js-offline:
    name: JS offline (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @invisibledb/js
      - run: npm test -w @invisibledb/js
      - name: Publish dry run
        run: npm pack --dry-run -w @invisibledb/js

  js-live:
    name: JS live conformance (PocketBase ${{ env.PB_VERSION }}, Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IDB_URL: http://127.0.0.1:8090
      IDB_ADMIN_EMAIL: ci-admin@invisibledb.test
      IDB_USER_EMAIL: ci-alice@invisibledb.test
      PB_DIR: /tmp/invisibledb-pb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @invisibledb/js

      - name: Generate throwaway credentials
        run: |
          set -euo pipefail
          ADMIN_PW="$(openssl rand -hex 24)"
          USER_PW="$(openssl rand -hex 24)"
          echo "::add-mask::$ADMIN_PW"
          echo "::add-mask::$USER_PW"
          echo "IDB_ADMIN_PASSWORD=$ADMIN_PW" >> "$GITHUB_ENV"
          echo "IDB_USER_PASSWORD=$USER_PW" >> "$GITHUB_ENV"

      - name: Install PocketBase ${{ env.PB_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p "$PB_DIR"
          curl -fsSL -o "$PB_DIR/pb.zip" \
            "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip"
          unzip -q -o "$PB_DIR/pb.zip" -d "$PB_DIR"
          chmod +x "$PB_DIR/pocketbase"
          "$PB_DIR/pocketbase" --version || true

      - name: Bootstrap superuser and start the server with the repo hooks
        run: |
          set -euo pipefail
          "$PB_DIR/pocketbase" superuser upsert "$IDB_ADMIN_EMAIL" "$IDB_ADMIN_PASSWORD" --dir="$PB_DIR/pb_data"
          setsid nohup "$PB_DIR/pocketbase" serve --http=127.0.0.1:8090 \
            --dir="$PB_DIR/pb_data" \
            --hooksDir="$GITHUB_WORKSPACE/deploy/vps/pocketbase/pb_hooks" \
            > "$PB_DIR/server.log" 2>&1 < /dev/null &
          for i in $(seq 1 60); do
            if curl -fsS "$IDB_URL/api/health" > /dev/null; then echo "healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          cat "$PB_DIR/server.log"
          exit 1

      - name: Seed the conformance fixture
        run: |
          python3 scripts/sdk-conformance/seed-pocketbase.py \
            --url "$IDB_URL" --batch enabled

      - name: Live conformance suite
        env:
          INVISIBLEDB_LIVE_URL: ${{ env.IDB_URL }}
          INVISIBLEDB_LIVE_EMAIL: ${{ env.IDB_USER_EMAIL }}
          INVISIBLEDB_LIVE_PASSWORD: ${{ env.IDB_USER_PASSWORD }}
        run: npm run test:live -w @invisibledb/js

      - name: Stop PocketBase
        if: always()
        run: pkill -f "[p]ocketbase serve" || true

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pocketbase-server-log
          path: /tmp/invisibledb-pb/server.log
          if-no-files-found: ignore
          retention-days: 7

  kotlin:
    name: Kotlin/JVM (JDK 17, Gradle 8.10.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/sdk-kotlin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.10.2"
      - name: Unit tests (JDK HttpServer stub)
        run: gradle --no-daemon test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kotlin-test-reports
          path: packages/sdk-kotlin/build/reports/tests
          if-no-files-found: ignore
          retention-days: 7

  swift:
    name: Swift (macOS 14, XCTest)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Swift version
        run: swift --version
      - name: Build and test
        run: swift test --package-path packages/sdk-swift

  dart:
    name: Dart (existing unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/sdk-dart
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart test
