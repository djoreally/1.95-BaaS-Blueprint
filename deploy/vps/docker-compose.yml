# InvisibleDB VPS runtime — one PocketBase per customer, Caddy on the edge.
#
# Layout on the box:
#   /srv/idb/            compose project root (this directory's contents)
#   /srv/idb/backups/    nightly SQLite dumps (host cron -> bin/backup)
#   /srv/idb/keys/       per-customer API keys (<slug>.key, 0600)
#
# Customer traffic: <slug>.BASE_DOMAIN -> Caddy -> gateway -> isolated tenant network.
# Per-customer PocketBase containers are created by bin/provision and are attached
# to dedicated idb-tenant-<slug> bridge networks, never the shared edge network.

name: idb

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/sites:/etc/caddy/sites:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:?set BASE_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      EDGE_SECRET: ${EDGE_SECRET:?set EDGE_SECRET in .env}
    networks:
      - idb-net

  gateway:
    build: ./gateway
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - /srv/idb/keys:/keys:ro
    environment:
      PORT: "8080"
      KEYS_DIR: /keys
      EDGE_SECRET: ${EDGE_SECRET:?set EDGE_SECRET in .env}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-67108864}
      PUBLIC_RATE_PER_MINUTE: ${PUBLIC_RATE_PER_MINUTE:-600}
      MANAGEMENT_RATE_PER_MINUTE: ${MANAGEMENT_RATE_PER_MINUTE:-180}
    networks:
      - idb-net

networks:
  idb-net:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
