# baas.conf — supervisor configuration. Sourced as shell; keep it simple KEY=VALUE.
# Copy to $HOME/baas/baas.conf (install.sh does this) and edit.

# Loopback port range handed out by ports.sh alloc. 1000 ports of headroom;
# binaries bind 127.0.0.1 only, so these never touch the public interface.
PORT_RANGE_START=18000
PORT_RANGE_END=18999

# Seconds curl waits for an app's health endpoint before declaring it down.
HEALTH_TIMEOUT_S=5

# Watchdog log keeps roughly this many lines (rotation adds ~100 of slack).
LOG_KEEP_LINES=1000

# Seconds stop.sh waits for SIGTERM before SIGKILL (SQLite WAL flush window).
STOP_GRACE_S=10
